name: Deploy EPUB optimizer to GitHub Pages
on:
  push:
    branches: [main, master]
    paths: ['tools/optimize-epub.html', 'tools/manifest.webmanifest', 'tools/sw.js', 'res/icon.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp tools/optimize-epub.html _site/index.html
          cp tools/manifest.webmanifest tools/sw.js _site/
          cp res/icon.png _site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
